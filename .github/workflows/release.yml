name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to upload to'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: macos-latest
    name: Build and Release

    steps:
    - uses: actions/checkout@v4

    - name: Show system info
      run: |
        sw_vers
        xcode-select -p
        xcodebuild -version

    - name: Build app
      run: ./build.sh

    - name: Verify build
      run: |
        echo "Checking app bundle structure..."
        ls -la build/Clonk.app/Contents/
        ls -la build/Clonk.app/Contents/MacOS/
        file build/Clonk.app/Contents/MacOS/Clonk
        echo "Testing app launch..."
        build/Clonk.app/Contents/MacOS/Clonk &
        APP_PID=$!
        sleep 2
        kill $APP_PID 2>/dev/null || true

    - name: Create DMG
      run: ./create-dmg.sh

    - name: Test DMG
      run: ./test-dmg.sh

    - name: Generate build attestation
      uses: actions/attest-build-provenance@v1
      with:
        subject-path: 'Clonk.dmg'
        subject-name: 'Clonk ${{ inputs.tag || github.event.release.tag_name }}'

    - name: Upload release asset
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG_NAME: ${{ inputs.tag || github.event.release.tag_name }}
      run: |
        gh release upload "${TAG_NAME}" "Clonk.dmg"
