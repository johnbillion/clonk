name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to upload to'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    name: Build and Release

    steps:
    - uses: actions/checkout@v4

    - name: Show system info
      run: |
        sw_vers
        xcode-select -p
        xcodebuild -version

    - name: Build app
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Create release archive
      env:
        TAG_NAME: ${{ inputs.tag || github.event.release.tag_name }}
      run: |
        cd build
        zip -r "Clonk-${TAG_NAME}.zip" Clonk.app

    - name: Upload release asset
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG_NAME: ${{ inputs.tag || github.event.release.tag_name }}
      run: |
        gh release upload "${TAG_NAME}" "build/Clonk-${TAG_NAME}.zip"
