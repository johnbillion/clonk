name: Test

on:
  push:
    branches: [ main, trunk ]
    paths:
      - 'Clonk/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'build.sh'
      - 'test.sh'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ main, trunk ]
    paths:
      - 'Clonk/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'build.sh'
      - 'test.sh'
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Show system info
      run: |
        sw_vers
        xcode-select -p
        xcodebuild -version

    - name: Run all tests
      run: ./test.sh

    - name: Upload test artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-artifacts
        path: Clonk/build/
